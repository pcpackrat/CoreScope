# CoreScope — runs alongside the meshcore-hub stack, reusing its MQTT broker.
#
# This file is meant to live at the ROOT of your CoreScope fork so Portainer
# can git-clone + build it as a "Repository" stack. See CORESCOPE_SETUP.md.
#
# After first start, put config.json into the corescope_data volume at
# /app/data/config.json  (template: corescope-config.json).

services:
  corescope:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: local
    pull_policy: build
    container_name: corescope
    restart: unless-stopped
    stop_grace_period: 30s
    stop_signal: SIGTERM
    ports:
      - "${CORESCOPE_HTTP_PORT:-8082}:3000"
    volumes:
      - corescope_data:/app/data
    environment:
      - NODE_ENV=production
      - DISABLE_MOSQUITTO=true
      - DISABLE_CADDY=true
      - TZ=America/Chicago
    networks:
      - default
      - meshhub
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # Network the meshcore-hub stack created. CONFIRM the real name (step 3
  # in CORESCOPE_SETUP.md) and edit this if it differs.
  meshhub:
    external: true
    name: meshcorehub_default

volumes:
  corescope_data:
